spring.application.name=citizentech-api

# Banco

spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50


app.jwt.secret=${JWT_SECRET:chave-de-desenvolvimento-ponto-certo-2026-gs}
app.jwt.expiration-ms=3600000

app.cors.allowed-origins=*

# Actuator

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=CitizenTech - Ponto Certo
info.app.description=API de pontos de onibus para o cidadao
info.app.version=0.0.1